[workspace]
resolver = "3"
members = ["nucleo", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# ort 2.0.0-rc.15 exige Rust 1.92 como mínimo.
rust-version = "1.92"
license = "UNLICENSED"
publish = false

# Los perfiles solo se leen en la raíz del workspace.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
