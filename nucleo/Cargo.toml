[package]
name = "nucleo"
description = "Núcleo del anonimizador: motor, formatos y almacén. No depende de Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cli"
path = "src/bin/cli/main.rs"

[dependencies]
thiserror = "2.0.21"
tracing = "0.1.44"

# `ort` se declara por objetivo más abajo: la feature api-NN debe coincidir con
# la versión de ONNX Runtime que se carga, y en Mac Intel esa versión es otra.

# Versión de API fijada a la de los binarios de PDFium descargados (chromium/7881).
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
# La misma versión que usa pdfium-render, sin códecs: solo se pintan los
# rectángulos sobre la página renderizada, que PDFium guarda comprimida.
image = { version = "0.25.10", default-features = false }
# DOCX desde un PDF. Sin `image`: el texto va sin imágenes.
docx-rs = { version = "0.4.22", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
unicode-normalization = "0.1.26"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }

# DOCX. Sin funciones por defecto: solo el método deflate, que es el que usa
# Word, con el compresor en Rust puro (sin zopfli, que es muy lento al
# comprimir). Fuera el cifrado de ZIP y los demás métodos de compresión.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"

# Almacén cifrado. Sin el generador de aes-gcm: la clave y los nonces salen
# de getrandom directamente. `zeroize` borra la clave y el JSON
# descifrado de la memoria al soltarlos.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "1.9.1"
getrandom = "0.4.3"
# Modo `v1` (el de por defecto): elige solo el Administrador de credenciales en
# Windows y el Llavero en Mac. Los almacenes de Linux no entran en esos binarios.
keyring = "4.2.0"
sha2 = { version = "0.11.1", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }
# Con las funciones por defecto, para leer la zona horaria del sistema, y
# `serde` para guardar las fechas en el almacén.
jiff = { version = "0.2.38", features = ["serde"] }

# ONNX Runtime. Sin `download-binaries`, `fetch-models` ni TLS: ort no puede
# descargar nada; la biblioteca se carga desde `recursos/` en tiempo de
# ejecución (`load-dynamic`). La feature api-NN fija la versión de la C API
# contra la que enlaza ort y debe coincidir con la del binario cargado.
#
# Mac Intel: Microsoft no publica binarios de ONNX Runtime para Mac x86_64
# desde la 1.23.2 (API 23); la 1.31 solo sale para arm64. Por eso en Mac Intel
# se usa la 1.23.2 con api-23, y en el resto (Windows x64 y Mac Apple Silicon)
# la 1.31.0 con api-31. Ver DECISIONES.md y scripts/recursos.lock.json.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }

[dev-dependencies]
tempfile = "3.27.0"

# Plazo de caducidad fijado por sistemas en el registro de Windows. De
# Microsoft, solo lectura del registro, sin red.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.100.0"
